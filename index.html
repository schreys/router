<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fietsplanner – komoot clone</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>🚲 Fietsplanner</h1>
    </header>

    <section>
      <h2>Kaart</h2>
      <label class="field">
        Thunderforest API-key (OpenCycleMap)
        <div class="row">
          <input id="apiKey" type="password" placeholder="plak je key hier" />
          <button id="saveKey" title="Opslaan">💾</button>
        </div>
        <small>Gratis key via <a href="https://manage.thunderforest.com/" target="_blank" rel="noopener">thunderforest.com</a>. Zonder key wordt CyclOSM gebruikt.</small>
      </label>
    </section>

    <section>
      <h2>Routes</h2>
      <div class="row">
        <button id="newRoute" class="primary grow">➕ Nieuwe route</button>
        <label class="button" title="GPX-bestanden importeren (of sleep ze op de kaart)">📂 GPX<input id="gpxInput" type="file" accept=".gpx,application/gpx+xml" multiple hidden /></label>
      </div>
      <ul id="routeList" class="route-list"></ul>
      <p id="routesEmpty" class="hint">Nog geen routes. Maak een nieuwe route of sleep GPX-bestanden op de kaart.</p>
    </section>

    <section>
      <h2>Routing</h2>
      <label class="field">
        Profiel
        <select id="profile">
          <option value="trekking">Toerfiets</option>
          <option value="fastbike">Racefiets</option>
          <option value="safety">Veilig (rustige wegen)</option>
          <option value="mtb">Mountainbike</option>
          <option value="shortest">Kortste</option>
          <option value="hiking-mountain">Wandelen</option>
        </select>
      </label>
      <label class="check"><input id="straight" type="checkbox" /> Rechte lijnen (geen routing)</label>
      <p class="hint" id="routerStatus"></p>
    </section>
  </aside>

  <main>
    <div id="map"></div>
    <div id="elevation" class="hidden">
      <div class="elev-header">
        <span id="elevTitle">Hoogteprofiel</span>
        <button id="elevClose" title="Sluiten">✕</button>
      </div>
      <canvas id="elevCanvas"></canvas>
    </div>
    <div id="toast" class="hidden"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
